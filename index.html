<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang</title>
    <style>
        /* Mengatur latar belakang dengan gradasi modern */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kotak kartu utama di tengah */
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        h2 {
            margin-top: 0;
            color: #2d3748;
            font-size: 22px;
        }

        p {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Animasi lingkaran loading */
        .spinner {
            border: 4px solid #edf2f7;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Memuat Halaman</h2>
        <p>Silakan tunggu sebentar, sistem sedang mempersiapkan halaman untuk Anda.</p>
        <div class="spinner"></div>
    </div>

</body>
</html>
